<!DOCTYPE html>
<html manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 13.00 FW GoldHEN Host by OBADA</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<script>
(function () {
    "use strict";

    var appCache = window.applicationCache;
    var msg = document.getElementById("msgs");

    function show(text) {
        msg.innerHTML = text;
        console.log("[CACHE-V2] " + text);
    }

    function checking() {
        show("Checking Offline Cache ...");
    }

    function downloading() {
        show("Downloading Offline Cache ...");
    }

    function progress(e) {
        if (
            e &&
            e.total > 0 &&
            typeof e.loaded === "number"
        ) {
            var percent = Math.round(
                (e.loaded / e.total) * 100
            );

            show(
                "Installing Offline Cache: " +
                percent +
                "%"
            );

            console.log(
                "[CACHE-V2] " +
                e.loaded +
                "/" +
                e.total +
                " = " +
                percent +
                "%"
            );
        }
    }

    function cached() {
        show(
            "Cache Installed Successfully ✔" +
            "<br><small>" +
            "Close and re-open the browser." +
            "</small>"
        );
    }

    function noUpdate() {
        show(
            "Offline Cache Already Installed ✔" +
            "<br><small>" +
            "Close and re-open the browser." +
            "</small>"
        );
    }

    function updateReady() {
        show("Cache Updated Successfully ✔");

        try {
            appCache.swapCache();
        } catch (e) {
            console.log(
                "[CACHE-V2] swapCache:",
                e
            );
        }
    }

    function error(e) {
        console.error(
            "[CACHE-V2] CACHE ERROR",
            e
        );

        show(
            "Cache Error ⚠" +
            "<br><small>" +
            "Application Cache failed." +
            "<br>" +
            "Check the browser console." +
            "</small>"
        );
    }

    function abort() {
        show(
            "Cache Download Aborted ⚠"
        );
    }

    appCache.addEventListener(
        "checking",
        checking,
        false
    );

    appCache.addEventListener(
        "downloading",
        downloading,
        false
    );

    appCache.addEventListener(
        "progress",
        progress,
        false
    );

    appCache.addEventListener(
        "cached",
        cached,
        false
    );

    appCache.addEventListener(
        "noupdate",
        noUpdate,
        false
    );

    appCache.addEventListener(
        "updateready",
        updateReady,
        false
    );

    appCache.addEventListener(
        "error",
        error,
        false
    );

    appCache.addEventListener(
        "abort",
        abort,
        false
    );

})();
</script>
