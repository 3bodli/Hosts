<head>
    <meta charset="UTF-8">

    <title>PS4 13.00 FW GoldHEN Host by OBADA</title>

<body>

<script>
(function () {
    "use strict";

    var appCache = window.applicationCache;
    var msg;
    var progress = 0;
    var events = [];
    var resources = [
        "../img.jpg",
        "../style.css",
        "chain_poops.js",
        "int64.js",
        "mem.js",
        "ps4_offsets.js",
        "index.html",
        "core.js?v=10",
        "patches/payload.bin"
    ];

    function log(text) {
        console.log("[APP-CACHE] " + text);

        events.push(text);

        if (events.length > 20) {
            events.shift();
        }
    }

    function show(text) {
        if (!msg) {
            msg = document.getElementById("msgs");
        }

        if (msg) {
            msg.innerHTML = text;
        }

        log(text.replace(/<[^>]*>/g, ""));
    }

    function showProgress(e) {
        if (
            e &&
            typeof e.loaded === "number" &&
            typeof e.total === "number" &&
            e.total > 0
        ) {
            progress = Math.round(
                (e.loaded / e.total) * 100
            );
        } else {
            progress++;
        }

        if (progress > 100) {
            progress = 100;
        }

        show(
            "Installing Offline Cache: " +
            progress +
            "%"
        );

        log(
            "Progress " +
            e.loaded +
            "/" +
            e.total +
            " (" +
            progress +
            "%)"
        );
    }

    function statusName(status) {
        switch (status) {
            case appCache.UNCACHED:
                return "UNCACHED";

            case appCache.IDLE:
                return "IDLE";

            case appCache.CHECKING:
                return "CHECKING";

            case appCache.DOWNLOADING:
                return "DOWNLOADING";

            case appCache.UPDATEREADY:
                return "UPDATEREADY";

            case appCache.OBSOLETE:
                return "OBSOLETE";

            default:
                return "UNKNOWN (" + status + ")";
        }
    }

    function showError(e) {
        console.error(
            "[APP-CACHE] ERROR EVENT",
            e
        );

        var details =
            "<br><br>" +
            "<small>" +
            "Status: " +
            statusName(appCache.status) +
            "<br>" +
            "Progress: " +
            progress +
            "%" +
            "<br>" +
            "Last event: " +
            (events.length ?
                events[events.length - 1] :
                "unknown") +
            "</small>";

        show(
            "Cache Error ⚠" +
            details
        );

        /*
         * Print manifest resources so we can compare
         * them manually with the server.
         */
        console.group("[APP-CACHE] Manifest resources");

        for (var i = 0; i < resources.length; i++) {
            console.log(
                "#" + (i + 1),
                resources[i]
            );
        }

        console.groupEnd();

        console.error(
            "[APP-CACHE] Full event history:",
            events
        );
    }

    function showAbort() {
        show(
            "Cache Download Aborted ⚠" +
            "<br><small>" +
            "Progress: " +
            progress +
            "%" +
            "</small>"
        );
    }

    function checking() {
        show("Checking Offline Cache ...");
    }

    function downloading() {
        show("Downloading Offline Cache ...");
    }

    function noupdate() {
        show("Offline Cache Already Installed ✔");

        setTimeout(function () {
            show(
                "Now Close And Re-Open Your Browser ..."
            );
        }, 2500);
    }

    function cached() {
        show("Cache Installed Successfully ✔");

        setTimeout(function () {
            show(
                "Now Close And Re-Open Your Browser ..."
            );
        }, 3500);
    }

    function updateReady() {
        log("UPDATE READY");

        try {
            if (
                appCache.status ===
                appCache.UPDATEREADY
            ) {
                appCache.swapCache();
                log("swapCache() successful");
            }
        } catch (err) {
            console.error(
                "[APP-CACHE] swapCache failed:",
                err
            );
        }

        show("Cache Updated Successfully ✔");
    }

    appCache.addEventListener(
        "checking",
        checking,
        false
    );

    appCache.addEventListener(
        "downloading",
        downloading,
        false
    );

    appCache.addEventListener(
        "progress",
        showProgress,
        false
    );

    appCache.addEventListener(
        "noupdate",
        noupdate,
        false
    );

    appCache.addEventListener(
        "cached",
        cached,
        false
    );

    appCache.addEventListener(
        "updateready",
        updateReady,
        false
    );

    appCache.addEventListener(
        "error",
        showError,
        false
    );

    appCache.addEventListener(
        "abort",
        showAbort,
        false
    );

    window.addEventListener(
        "load",
        function () {

            log(
                "Initial status: " +
                statusName(appCache.status)
            );

            console.log(
                "[APP-CACHE] Manifest resources:"
            );

            for (
                var i = 0;
                i < resources.length;
                i++
            ) {
                console.log(
                    "#" + (i + 1) +
                    " -> " +
                    resources[i]
                );
            }
        },
        false
    );

})();
</script>
